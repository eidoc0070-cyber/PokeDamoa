<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Open Graph (SNS 공유 시 이미지 설정) -->
    <meta property="og:image" content="https://pokedamoa.pages.dev/og-image.jpg" />
    <meta property="og:title" content="PokeDamoa (포케다모아)" />
    <meta property="og:description" content="포켓몬 관련 정보를 한눈에 모아보는 도구입니다." />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="포케다모아" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222" />
    <title>PokeDamoa (포케다모아)</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- Preload data files for faster initial render -->
    <link rel="preload" href="/pokedex-data.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/moves-data.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/abilities-data.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/items-data.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="app">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #666;">
        <div style="border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #ffcb05; animation: spin 1s linear infinite; margin-bottom: 15px;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
        <span>앱을 불러오는 중입니다...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
