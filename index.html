<!DOCTYPE html>
<html lang="ko">
  <head>
    <script type="text/javascript">
      // TEMP DEBUG: 오프라인 하얀 화면 버그 진단용, 원인 파악 후 제거 예정
      (function() {
        function showError(type, msg, source, lineno, colno, err) {
          var container = document.getElementById('debug-error-box');
          if (!container) {
            container = document.createElement('div');
            container.id = 'debug-error-box';
            container.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;background:rgba(180,0,0,0.95);color:#fff;padding:20px;font-family:monospace;font-size:14px;overflow:auto;white-space:pre-wrap;word-break:break-all;';
            var closeBtn = document.createElement('button');
            closeBtn.innerText = '[닫기]';
            closeBtn.style.cssText = 'float:right;background:#fff;color:#900;border:none;padding:8px 16px;font-weight:bold;cursor:pointer;margin-bottom:12px;border-radius:4px;';
            closeBtn.onclick = function() { container.remove(); };
            container.appendChild(closeBtn);
            var title = document.createElement('h3');
            title.innerText = '⚠️ [TEMP DEBUG] 감지된 에러';
            title.style.cssText = 'margin:0 0 10px 0;color:#ffcccc;';
            container.appendChild(title);
            var content = document.createElement('div');
            content.id = 'debug-error-content';
            container.appendChild(content);
            document.body ? document.body.appendChild(container) : document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(container); });
          }
          var content = document.getElementById('debug-error-content');
          if (content) {
            var errDetail = err && err.stack ? err.stack : (err || '');
            var item = document.createElement('div');
            item.style.cssText = 'margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.3);';
            item.innerHTML = '<strong>[' + type + ']</strong> ' + (msg || '') + '<br>' +
                             '<small>Source: ' + (source || 'N/A') + ':' + (lineno || 0) + ':' + (colno || 0) + '</small><br>' +
                             '<pre style="margin-top:6px;background:rgba(0,0,0,0.3);padding:8px;border-radius:4px;">' + errDetail + '</pre>';
            content.appendChild(item);
          }
        }

        window.addEventListener('error', function(e) {
          showError('UNCAUGHT ERROR', e.message, e.filename, e.lineno, e.colno, e.error);
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason && reason.message ? reason.message : String(reason);
          showError('UNHANDLED REJECTION', msg, reason && reason.fileName, reason && reason.lineNumber, 0, reason);
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Open Graph (SNS 공유 시 이미지 설정) -->
    <meta property="og:image" content="https://pokedamoa.pages.dev/og-image.jpg" />
    <meta property="og:title" content="PokeDamoa (포케다모아)" />
    <meta property="og:description" content="포켓몬 관련 정보를 한눈에 모아보는 도구입니다." />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="포케다모아" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#222222" />
    <title>PokeDamoa (포케다모아)</title>
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;">
      <h1>포케다모아 (PokeDamoa) - 포켓몬 도감 및 도구 모음</h1>
      <p>포케다모아는 포켓몬스터 정보를 한눈에 볼 수 있는 종합 도구입니다. 최신 세대 도감 정보, 포켓몬 개체값 계산기, 포획률 계산기, 기술 및 특성 데이터, 타입 상성표 등 포켓몬 게임 플레이에 필요한 모든 데이터를 제공합니다.</p>
    </div>
    <div id="app">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333;">
        <div class="loader" style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #ffcb05; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @media (prefers-color-scheme: dark) {
            #app > div { background-color: #121212 !important; color: #f5f5f5 !important; }
            .loader { border-color: #333 !important; border-top-color: #ffcb05 !important; }
          }
        </style>
        <p style="font-weight: 500; margin: 0;">포케다모아 로딩 중...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
